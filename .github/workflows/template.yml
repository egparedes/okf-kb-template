name: template

# Renders the template in several configurations and runs each result's checks
# and tooling tests, on Linux, macOS and Windows, with the oldest supported and
# the newest Python. Third-party actions are pinned by commit; Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.locale && format(', {0} locale', matrix.locale) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          # No UTF-8 default: a file read or written without encoding="utf-8" fails
          # here as it would on Windows with a legacy code page.
          - os: ubuntu-latest
            python: "3.11"
            locale: C
    env:
      LC_ALL: ${{ matrix.locale }}
      PYTHONUTF8: ${{ matrix.locale && '0' || '' }}
    steps:
      # Check the .claude/skills symlink out as a symlink (the runner may create them), so
      # Copier renders it as one; the tests accept the text placeholder of other checkouts too.
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # copier reads the template's tags and history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }} # also used by the rendered knowledge bases
      - run: uv sync --locked
      - name: Lint and type check (once; the result does not depend on the runner)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked poe lint
      - run: uv run --locked poe test
