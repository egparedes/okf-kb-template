[project]
name = "okf-kb-template"
version = "0.4.0"
description = "Copier template for LLM-maintained knowledge bases that are OKF v0.2 bundles and Obsidian vaults."
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["copier>=9.6", "pytest>=8"]
docs = ["zensical>=0.0.65"]

[tool.pytest.ini_options]
testpaths = ["tests"]
