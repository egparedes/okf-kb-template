name: kb

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly external link check (source URL rot)

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: uv sync
      - run: just ci

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find the knowledge-base folder
        run: |
          n=$(sed -n '/^\[tool\.kb\]/,/^\[/s/^bundle = "\(.*\)"$/\1/p' pyproject.toml)
          echo "BUNDLE=${n:-kb}" >> "$GITHUB_ENV"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme https --scheme http --accept '200..=299,403,429' --root-dir ${{ github.workspace }}/${{ env.BUNDLE }} --exclude-path ${{ env.BUNDLE }}/.obsidian '${{ env.BUNDLE }}/**/*.md'
          fail: true
