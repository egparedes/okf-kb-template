name: kb

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly external link check (source URL rot)

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: uv sync
      - run: just ci

  links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir ${{ github.workspace }}/kb --exclude-path kb/.obsidian 'kb/**/*.md'
          fail: true
